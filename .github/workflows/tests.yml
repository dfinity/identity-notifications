name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - name: Build the example canister
        run: cargo build --release --target wasm32-unknown-unknown -p chat-example
      - name: Check the example's candid is current
        run: cargo test -p chat-example candid_is_up_to_date

  motoko:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: motoko
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: caffeinelabs/setup-mops@v1
      - run: mops install
      - run: mops test
      # The demo includes the whole library, so this also holds `src/` to no warnings.
      - name: Build the demo canister
        run: $(mops toolchain bin moc) $(mops sources) -Werror demo/chat/main.mo -o chat.wasm

  # Mops resolves one `core` per app, the highest any package asks for, so the
  # library also has to compile against the newest `core` it allows.
  motoko-latest-core:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: motoko
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: caffeinelabs/setup-mops@v1
      - run: mops update core
      - run: mops test
      - name: Build the demo canister
        run: $(mops toolchain bin moc) $(mops sources) demo/chat/main.mo -o chat.wasm

  motoko-format:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: motoko
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run format:check
