name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - name: Build the example canister
        run: cargo build --release --target wasm32-unknown-unknown -p chat-example
      - name: Check the example's candid is current
        run: cargo test -p chat-example candid_is_up_to_date

  # An app's lockfile can hold any version the manifest allows, so the library
  # also has to build against the lowest versions of the IC crates it names.
  rust-minimum-versions:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Pin the IC crates to the lowest versions Cargo.toml allows
        run: |
          # Dependents first: ic-cdk at its floor is what lets candid go down to its own.
          for crate in ic-cdk ic-cdk-timers ic-stable-structures candid; do
            floor=$(sed -n "s/^$crate = \"\(.*\)\"$/\1/p" Cargo.toml)
            while [ "$(tr -cd . <<<"$floor" | wc -c)" -lt 2 ]; do floor="$floor.0"; done
            cargo update -p "$crate" --precise "$floor"
          done
      - run: cargo test
      - run: cargo build --release --target wasm32-unknown-unknown -p chat-example

  motoko:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: motoko
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: caffeinelabs/setup-mops@v1
      - run: mops install
      - run: mops test
      # The demo includes the whole library, so this also holds `src/` to no warnings.
      - name: Build the demo canister
        run: $(mops toolchain bin moc) $(mops sources) -Werror demo/chat/main.mo -o chat.wasm

  # Mops resolves one `core` per app, the highest any package asks for, so the
  # library also has to compile against the newest `core` it allows.
  motoko-latest-core:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: motoko
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: caffeinelabs/setup-mops@v1
      - run: mops update core
      - run: mops test
      - name: Build the demo canister
        run: $(mops toolchain bin moc) $(mops sources) demo/chat/main.mo -o chat.wasm

  motoko-format:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: motoko
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run format:check
