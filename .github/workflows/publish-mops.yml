name: publish on Mops

on:
  workflow_dispatch:
  push:
    tags:
      - motoko-v*.*.*

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: motoko

    steps:
      - uses: actions/checkout@v6
      - uses: dfinity/setup-dfx@main # Currently required for `mops publish`
      # The identity is imported here rather than through the action's
      # `identity-pem` input: with that input the action resolves moc from the
      # repository root, where there is no `mops.toml`.
      - uses: caffeinelabs/setup-mops@v1
      - run: mops user import --no-encrypt -- "$MOPS_IDENTITY_PEM"
        env:
          # `MOPS_IDENTITY_PEM` is scoped to the `release` environment; see Settings → Environments.
          MOPS_IDENTITY_PEM: ${{ secrets.MOPS_IDENTITY_PEM }}
      - name: Check the changelog has this version
        run: ../.github/scripts/changelog-section.sh Changelog.md "${GITHUB_REF_NAME#motoko-v}" > /dev/null
      - run: mops install
      - run: mops publish

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/motoko-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # The changelog section comes first, then the merged PRs since the motoko-v
      # tag just below this one, so the list skips the other package's releases.
      - run: |
          .github/scripts/changelog-section.sh motoko/Changelog.md "${GITHUB_REF_NAME#motoko-v}" > notes.md
          previous=$(git tag --list 'motoko-v*' --sort=-v:refname | awk -v tag="$GITHUB_REF_NAME" 'found { print; exit } $0 == tag { found = 1 }')
          gh release create "$GITHUB_REF_NAME" --title "Motoko ${GITHUB_REF_NAME#motoko-v}" --notes-file notes.md --generate-notes ${previous:+--notes-start-tag "$previous"}
        env:
          GH_TOKEN: ${{ github.token }}
