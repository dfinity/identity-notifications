name: publish on crates.io

on:
  workflow_dispatch:
  push:
    tags:
      - rust-v*.*.*

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing: the crates.io token is minted per run
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # crates.io trusts this repository, this workflow file, and the `release`
      # environment (the crate's Settings -> Trusted Publishing).
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - run: cargo publish --locked -p identity-notifications
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/rust-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Notes start from the rust-v tag just below this one, so they skip the other package's releases.
      - run: |
          previous=$(git tag --list 'rust-v*' --sort=-v:refname | awk -v tag="$GITHUB_REF_NAME" 'found { print; exit } $0 == tag { found = 1 }')
          gh release create "$GITHUB_REF_NAME" --title "Rust ${GITHUB_REF_NAME#rust-v}" --generate-notes ${previous:+--notes-start-tag "$previous"}
        env:
          GH_TOKEN: ${{ github.token }}
