name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  entry:
    # A change with nothing to tell users, such as a refactor or a test, carries
    # the `no-changelog` label.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Every changed package has a changelog entry
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD)
          status=0
          for package in motoko rust; do
            if grep -q "^$package/src/" <<<"$changed" && ! grep -qx "$package/Changelog.md" <<<"$changed"; then
              echo "::error file=$package/Changelog.md::$package/src changed: add an entry under \"## Next\" in $package/Changelog.md, or label the PR no-changelog."
              status=1
            fi
          done
          exit $status
